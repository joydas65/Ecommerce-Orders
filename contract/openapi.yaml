openapi: 3.1.0
info:
  title: Joy's Store test checkout and persistent orders
  version: 1.1.0
  description: Session-owned simulated orders and optional Stripe hosted test checkout. No real money moves and the order API accepts no personal shipping data. Browser callers use the storefront BFF; service routes require bearer authentication and a guest identity. Stripe webhooks instead verify the signature on the raw request body. Query parameters are rejected on authenticated API routes.
security:
  - serviceBearer: []
paths:
  /v1/checkout-quotes:
    post:
      operationId: createQuote
      parameters:
        - $ref: '#/components/parameters/Guest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, shippingMethod, destination]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required: [productId, quantity]
                    properties:
                      productId: { $ref: '#/components/schemas/ProductId' }
                      quantity: { type: integer, minimum: 1, maximum: 99 }
                paymentProvider: { type: string, enum: [simulated, stripe-test], default: simulated }
                shippingMethod: { $ref: '#/components/schemas/ShippingMethod' }
                destination:
                  type: object
                  additionalProperties: false
                  required: [country]
                  properties:
                    country: { type: string, enum: [US, GB, SG] }
                    region:
                      type: string
                      description: US requires CA, NY, or TX. GB and SG require an empty or omitted region.
      responses:
        '201':
          description: Authoritative quote valid for fifteen minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders:
    post:
      operationId: placeOrder
      description: Confirms only simulated quotes. Stripe quotes must use payment-sessions; payment providers cannot be mixed.
      parameters:
        - $ref: '#/components/parameters/Guest'
        - name: Idempotency-Key
          in: header
          required: true
          description: Generate once per checkout attempt and retain across ambiguous failures and reloads. Same key with another quote is rejected.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId]
              properties:
                quoteId: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
      responses:
        '201':
          description: Order and durable replay record committed atomically; the quote can create only one order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Original order replayed, including when the quote subsequently expires.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}:
    get:
      operationId: readReceipt
      parameters:
        - $ref: '#/components/parameters/Guest'
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^order_[0-9a-f-]{36}$' }
      responses:
        '200':
          description: The authenticated guest's receipt. Private no-store. Resolved receipts normally expire after thirty days; Stripe confirmation starts a fresh thirty-day period. Pending/review Stripe receipts remain readable until resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: Missing, foreign-owner, malformed, and expired order identities return the same public response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/payment-sessions:
    post:
      operationId: createPaymentSession
      description: Durably creates or replays a Stripe test order and hosted checkout session. Creation and browser return do not confirm payment. Retain the same idempotency key and quote across ambiguous failures; do not start another attempt. Only stripe-test quotes are accepted.
      parameters:
        - $ref: '#/components/parameters/Guest'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteReference' }
      responses:
        '201':
          description: New durable attempt; normally pending payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '200':
          description: Original attempt replayed. The current order state may already be resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/reconcile:
    post:
      operationId: reconcilePayment
      description: Retrieves current Stripe test session state and validates identity, totals and items against the persisted snapshot. Uncertain or mismatched state never confirms payment.
      parameters:
        - $ref: '#/components/parameters/Guest'
        - $ref: '#/components/parameters/OrderId'
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/PaymentSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/cancel:
    post:
      operationId: cancelPayment
      description: Expires an unpaid Stripe test session then retrieves and validates its actual state. A payment racing with cancellation may return CONFIRMED/PAID; the requested action does not guarantee cancellation.
      parameters:
        - $ref: '#/components/parameters/Guest'
        - $ref: '#/components/parameters/OrderId'
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/PaymentSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      description: Verifies the signature on the untouched raw JSON body (maximum 262144 bytes), rejects live-mode events, and retrieves fresh provider state before applying supported checkout.session events. Durable event deduplication and monotonic paid state tolerate retries and reordered delivery. No service bearer or guest header is required.
      security:
        - stripeSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe snapshot event signed for this endpoint; checkout.session.completed, async_payment_succeeded, async_payment_failed and expired are handled. Other valid signed test event types are acknowledged without a transition.
      responses:
        '200':
          description: Event handled or safely ignored. Acknowledgment alone does not assert a paid order.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { const: true }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /internal/cleanup:
    get:
      operationId: cleanupExpired
      security:
        - cleanupBearer: []
      responses:
        '200':
          description: Eligible expired receipts, replay records and unconsumed quotes removed; unresolved Stripe pending/review records are retained. Returns aggregate counts only; does not reconcile payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: integer, minimum: 0 }
                  quotes: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Application is running. Does not claim database readiness.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      description: ORDERS_API_SECRET of at least 32 printable non-space characters, stored only on the storefront and orders servers. The guest header is trusted only from this authenticated server-to-server caller.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe signature verified against STRIPE_WEBHOOK_SECRET using the exact raw request bytes and timestamp tolerance.
    cleanupBearer:
      type: http
      scheme: bearer
      description: Separate CRON_SECRET. The checkout secret cannot authorize retention cleanup.
  parameters:
    Guest:
      name: X-Guest-Id
      in: header
      required: true
      description: UUID guest identity supplied by the trusted storefront server from its opaque, HttpOnly guest cookie. Never accept a browser-supplied guest header in the storefront proxy.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Generate once per attempt; retain across ambiguous failures and reloads. Reuse with a different quote is rejected.
      schema: { type: string, format: uuid }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^order_[0-9a-f-]{36}$' }
  requestBodies:
    EmptyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
  schemas:
    ProductId:
      type: string
      enum: [demo-desk-mat, demo-notebook, demo-bottle, demo-tote, demo-laptop-stand, demo-desk-lamp]
    ShippingMethod:
      type: string
      enum: [demo-standard, demo-express]
    LineItem:
      type: object
      required: [productId, name, quantity, unitPriceCents, lineTotalCents]
      properties:
        productId: { $ref: '#/components/schemas/ProductId' }
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPriceCents: { type: integer, minimum: 0 }
        lineTotalCents: { type: integer, minimum: 0 }
    Totals:
      type: object
      required: [currency, items, shippingMethod, shippingCents, subtotalCents, taxCents, totalCents, pricingVersion]
      properties:
        currency: { const: USD }
        items:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/LineItem' }
        shippingMethod: { $ref: '#/components/schemas/ShippingMethod' }
        shippingCents: { type: integer, minimum: 0 }
        subtotalCents: { type: integer, minimum: 0 }
        taxCents: { type: integer, minimum: 0, description: 'Illustrative 8% of products plus shipping, rounded half-up in cents.' }
        totalCents: { type: integer, minimum: 0 }
        pricingVersion: { const: demo-v1 }
    Quote:
      allOf:
        - $ref: '#/components/schemas/Totals'
        - type: object
          required: [id, expiresAt, paymentProvider]
          properties:
            paymentProvider: { type: string, enum: [simulated, stripe-test] }
            id: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
            expiresAt: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/Totals'
        - type: object
          required: [id, reference, quoteId, status, paymentStatus, createdAt, expiresAt]
          properties:
            id: { type: string, pattern: '^order_[0-9a-f-]{36}$' }
            reference: { type: string }
            quoteId: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
            status: { type: string }
            paymentStatus: { type: string }
            paymentProvider: { type: string, enum: [simulated, stripe-test] }
            paymentMode: { const: test }
            createdAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
        - oneOf:
            - type: object
              properties:
                reference: { type: string, pattern: '^DEMO-' }
                status: { const: CONFIRMED }
                paymentStatus: { const: SIMULATED }
                paymentProvider: { const: simulated }
              not:
                required: [paymentMode]
              description: Legacy simulated receipts may omit paymentProvider.
            - type: object
              required: [paymentProvider, paymentMode]
              properties:
                reference: { type: string, pattern: '^TEST-' }
                paymentProvider: { const: stripe-test }
                paymentMode: { const: test }
              oneOf:
                - properties:
                    status: { const: PENDING_PAYMENT }
                    paymentStatus: { const: PENDING }
                - properties:
                    status: { const: CONFIRMED }
                    paymentStatus: { const: PAID }
                - properties:
                    status: { const: CANCELED }
                    paymentStatus: { const: CANCELED }
                - properties:
                    status: { const: PAYMENT_REVIEW }
                    paymentStatus: { const: REQUIRES_REVIEW }
    QuoteReference:
      type: object
      additionalProperties: false
      required: [quoteId]
      properties:
        quoteId: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
    PaymentSession:
      type: object
      required: [order, checkoutUrl]
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/Order'
            - type: object
              required: [paymentProvider, paymentMode]
              properties:
                paymentProvider: { const: stripe-test }
                paymentMode: { const: test }
        checkoutUrl:
          type: [string, 'null']
          pattern: '^https://checkout\.stripe\.com/'
          description: Resumable hosted URL only for an open pending session; otherwise null. Its presence is not proof of payment.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    PaymentSession:
      description: Current persisted Stripe test order and a resumable hosted URL when available.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentSession' }
    Error:
      description: Structured safe failure. An ambiguous 503 must retain the original submission key for retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

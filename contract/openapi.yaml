openapi: 3.1.0
info:
  title: Joy's Store test checkout and persistent orders
  version: 1.4.0
  description: Session-owned simulated orders and optional Stripe hosted test checkout. No real money moves and the order API accepts no personal shipping data. Browser callers use the storefront BFF; service routes require bearer authentication and a guest identity. Stripe webhooks instead verify the signature on the raw request body. Guest checkout routes reject query parameters. Merchant routes require a database-backed merchant session anchored to an explicitly allowed GitHub identity, optionally with explicitly linked Google sign-in. Customer routes independently require a customer Google session and restrict reads to its owned orders. The checkout bearer grants neither role.
security:
  - serviceBearer: []
paths:
  /v1/checkout-quotes:
    post:
      operationId: createQuote
      parameters:
        - $ref: '#/components/parameters/Guest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items, shippingMethod, destination]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items:
                    type: object
                    additionalProperties: false
                    required: [productId, quantity]
                    properties:
                      productId: { $ref: '#/components/schemas/ProductId' }
                      quantity: { type: integer, minimum: 1, maximum: 99 }
                paymentProvider: { type: string, enum: [simulated, stripe-test], default: simulated }
                shippingMethod: { $ref: '#/components/schemas/ShippingMethod' }
                destination:
                  type: object
                  additionalProperties: false
                  required: [country]
                  properties:
                    country: { type: string, enum: [US, GB, SG] }
                    region:
                      type: string
                      description: US requires CA, NY, or TX. GB and SG require an empty or omitted region.
      responses:
        '201':
          description: Authoritative quote valid for fifteen minutes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Quote' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders:
    post:
      operationId: placeOrder
      description: Confirms only simulated quotes. Stripe quotes must use payment-sessions; payment providers cannot be mixed. An optional customer session binds ownership atomically on the first reservation. Invalid customer sessions fail before creation. Retrying with another customer identity or switching guest/account returns CUSTOMER_CHECKOUT_CHANGED and never transfers ownership. Customer IDs in request bodies are rejected.
      parameters:
        - $ref: '#/components/parameters/OptionalCustomerSession'
        - $ref: '#/components/parameters/Guest'
        - name: Idempotency-Key
          in: header
          required: true
          description: Generate once per checkout attempt and retain across ambiguous failures and reloads. Same key with another quote is rejected.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteId]
              properties:
                quoteId: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
      responses:
        '201':
          description: Order and durable replay record committed atomically; the quote can create only one order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Original order replayed, including when the quote subsequently expires.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}:
    get:
      operationId: readReceipt
      parameters:
        - $ref: '#/components/parameters/Guest'
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: '^order_[0-9a-f-]{36}$' }
      responses:
        '200':
          description: The authenticated guest's receipt. Private no-store. Resolved receipts normally expire after thirty days; First verified Stripe payment or cancellation starts a fresh thirty-day period. Pending/review Stripe receipts remain readable until resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '404':
          description: Missing, foreign-owner, malformed, and expired order identities return the same public response.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/payment-sessions:
    post:
      operationId: createPaymentSession
      description: Durably creates or replays a Stripe test order and hosted checkout session. Creation and browser return do not confirm payment. Retain the same idempotency key and quote across ambiguous failures; do not start another attempt. Only stripe-test quotes are accepted. An optional verified customer session binds ownership at first reservation, before external Stripe work. Session expiry fails before creation; a retry with changed customer identity returns CUSTOMER_CHECKOUT_CHANGED and cannot transfer or attach the existing order.
      parameters:
        - $ref: '#/components/parameters/OptionalCustomerSession'
        - $ref: '#/components/parameters/Guest'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuoteReference' }
      responses:
        '201':
          description: New durable attempt; normally pending payment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '200':
          description: Original attempt replayed. The current order state may already be resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/reconcile:
    post:
      operationId: reconcilePayment
      description: Retrieves current Stripe test session state and validates identity, totals and items against the persisted snapshot. Uncertain or mismatched state never confirms payment.
      parameters:
        - $ref: '#/components/parameters/Guest'
        - $ref: '#/components/parameters/OrderId'
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/PaymentSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/orders/{id}/cancel:
    post:
      operationId: cancelPayment
      description: Expires an unpaid Stripe test session then retrieves and validates its actual state. A payment racing with cancellation may return CONFIRMED/PAID; the requested action does not guarantee cancellation.
      parameters:
        - $ref: '#/components/parameters/Guest'
        - $ref: '#/components/parameters/OrderId'
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { $ref: '#/components/responses/PaymentSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/webhooks/stripe:
    post:
      operationId: receiveStripeWebhook
      description: Verifies the signature on the untouched raw JSON body (maximum 262144 bytes), rejects live-mode events, and retrieves fresh provider state before applying supported checkout.session events. Durable event deduplication and monotonic paid state tolerate retries and reordered delivery. No service bearer or guest header is required.
      security:
        - stripeSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Stripe snapshot event signed for this endpoint; checkout.session.completed, async_payment_succeeded, async_payment_failed and expired are handled. Other valid signed test event types are acknowledged without a transition.
      responses:
        '200':
          description: Event handled or safely ignored. Acknowledgment alone does not assert a paid order.
          content:
            application/json:
              schema:
                type: object
                required: [received]
                properties:
                  received: { const: true }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/merchant/session:
    get:
      operationId: readMerchantSession
      security: [{ merchantSession: [] }]
      description: Verifies the signed session cookie, database session expiry, and linked immutable GitHub account ID against the merchant allowlist on every request. Returns no email, session token, or provider credentials.
      responses:
        '200':
          description: Authorized merchant identity. Private no-store.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [user, role]
                properties:
                  role: { const: merchant }
                  authentication:
                    type: object
                    additionalProperties: false
                    required: [providers, googleEnabled, googleLinked]
                    properties:
                      providers:
                        type: array
                        items: { type: string, enum: [github, google] }
                      googleEnabled: { type: boolean }
                      googleLinked: { type: boolean }
                  user:
                    type: object
                    additionalProperties: false
                    required: [id]
                    properties:
                      id: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/merchant/orders:
    get:
      operationId: listMerchantOrders
      security: [{ merchantSession: [] }]
      description: Newest-first live keyset view ordered by (created_at, id), with precise timestamps and a stable unique tie-breaker. A cursor is bound to its filter and does not grant authorization. Refresh to see newer orders. Resolved expired receipts are excluded; unresolved Stripe records remain visible. Unknown or duplicate query parameters fail validation. This collection endpoint is read-only.
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [all, paid, pending, canceled, review, simulated], default: all }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Minimal order summaries and the next-page cursor. Private no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantOrderPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/merchant/orders/{id}:
    get:
      operationId: readMerchantOrder
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      description: Explicit receipt-field projection across the store. Excludes guest identity, idempotency keys, raw provider events, checkout URLs and internal payment IDs. The existing guest receipt endpoint retains its separate ownership check.
      responses:
        '200':
          description: Retained order details. Private no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/merchant/orders/{id}/payment-checks:
    get:
      operationId: readMerchantPaymentChecks
      security: [{ merchantSession: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      description: Latest twenty audit events ordered by a durable event sequence, plus current eligibility. No query parameters. Events follow order retention; deleting a merchant identity does not erase actor attribution. Application events are append-only, not tamper-proof database storage.
      responses:
        '200':
          description: Eligibility and bounded history. Private no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantPaymentCheckHistory' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/merchant/orders/{id}/recheck-payment:
    post:
      operationId: recheckMerchantPayment
      security: [{ merchantSession: [] }]
      description: >-
        Retrieves only an existing session for an unresolved Stripe-test order; never creates or expires a session.
        Requires an independent live merchant session and exact storefront Origin; cross-site/same-site Fetch metadata is rejected.
        JSON is bounded to 16 KiB and query parameters are rejected. Persist one requestId across transport/503 ambiguity and retries.
        Actor-scoped request IDs bind to one order. Requested event commits before retrieval under a 30-second fenced lease.
        Final verified transition and result audit commit atomically. Replays return the saved event plus latest order state.
        New requests are limited to one per order per ten seconds and five per merchant per minute.
        Initial session authorization covers the bounded in-flight request; subsequent requests revalidate authorization.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId]
              properties:
                requestId: { type: string, format: uuid }
      responses:
        '200':
          description: A durable result, not necessarily payment success. provider_unavailable records failed retrieval; interrupted records no saved verified result. Retry a new check only after cooldown. A replay can report an older check with newer order state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantPaymentCheckResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: PAYMENT_CHECK_IN_PROGRESS includes error.retryAt; retry the same key after that time. PAYMENT_CHECK_NOT_ELIGIBLE applies only to an unreserved new request. IDEMPOTENCY_CONFLICT means that actor's key belongs to another order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429':
          description: PAYMENT_CHECK_RATE_LIMITED with error.retryAt; wait before starting or retrying the unreserved request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Result is not confirmed; retain and retry the same requestId. Disabled Stripe cannot create a new check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/auth/sign-in/social:
    post:
      operationId: startMerchantSignIn
      security: []
      description: Starts GitHub or enabled Google OAuth through Better Auth. Google sign-in requires a previously explicitly linked merchant identity; Google cannot create a merchant account. Matching email addresses never imply linking. Origin must exactly match the configured storefront origin. The provider, success destination and error destination are fixed. JSON is bounded to 16 KiB. OAuth state, PKCE, session signing and database-backed rate limits are library-managed.
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, callbackURL, errorCallbackURL]
              properties:
                provider: { type: string, enum: [github, google] }
                callbackURL: { const: /admin/orders }
                errorCallbackURL: { const: /admin/sign-in }
      responses:
        '200': { description: Selected enabled provider authorization URL and OAuth state cookies from Better Auth. }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { description: Authentication rate limit exceeded. }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/callback/github:
    get:
      operationId: finishMerchantSignIn
      security: []
      description: GitHub OAuth callback, forwarded by the storefront BFF with OAuth state cookies. Better Auth validates state and provider identity before creating a merchant session. Only allowlisted immutable GitHub account IDs may sign in.
      responses:
        '302': { description: Redirect to the fixed storefront success or error page, with applicable state/session cookies. }
        '400': { $ref: '#/components/responses/Error' }
        '429': { description: Authentication rate limit exceeded. }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/sign-out:
    post:
      operationId: signOutMerchant
      security: [{ merchantSession: [] }]
      description: Invalidates the current database session and clears its cookie. Requires the exact storefront Origin and an empty JSON object.
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { description: Session cleared. }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/ok:
    get:
      operationId: merchantAuthHealth
      security: []
      description: Library authentication readiness endpoint. Disabled or invalid configuration fails closed without affecting guest checkout.
      responses:
        '200': { description: Authentication handler available. }
        '503': { $ref: '#/components/responses/Error' }
  /v1/customer/session:
    get:
      operationId: readCustomerSession
      security: [{ customerSession: [] }]
      description: Verifies the customer signed cookie, current database session and persisted verified Google account. Merchant cookies, service bearer, guest identity and submitted role headers do not authorize this endpoint. Query parameters are rejected.
      responses:
        '200':
          description: Safe customer identity. Private no-store; no email, provider subject or credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSession' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/customer/orders:
    get:
      operationId: listCustomerOrders
      security: [{ customerSession: [] }]
      description: Lists only orders owned by the authenticated customer, newest first by (created_at, id). Ownership comes from the original verified session at reservation; guest orders are never backfilled. Cursors preserve microseconds and convey no access. Unknown or duplicate query parameters are rejected. Resolved expired receipts are hidden; unresolved Stripe receipts remain retained.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, minLength: 1, maxLength: 512 }
      responses:
        '200':
          description: Private order summaries with bounded keyset pagination. Uses the same safe projection as the merchant collection, restricted to this customer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantOrderPage' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/customer/orders/{id}:
    get:
      operationId: readCustomerOrder
      security: [{ customerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
      description: Read-only safe receipt projection for an order owned by the authenticated customer. No customer/guest IDs or provider credentials are returned. Missing, malformed, expired and other-owner IDs all return the same 404. Query parameters are rejected.
      responses:
        '200':
          description: Retained customer-owned receipt. Private no-store.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/customer-auth/sign-in/social:
    post:
      operationId: startCustomerSignIn
      security: []
      description: Starts only Google redirect OAuth for a public shopper. Requires the exact configured storefront Origin and rejects cross-site/same-site Fetch metadata. Only openid/email/profile scopes are requested. The provider, success and error destinations are fixed; extra fields including raw ID tokens and requested scopes are rejected. JSON is bounded to 16 KiB. State, PKCE, database rate limits and session signing are library-managed.
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, callbackURL, errorCallbackURL]
              properties:
                provider: { const: google }
                callbackURL: { const: /account }
                errorCallbackURL: { const: /account/sign-in }
      responses:
        '200': { description: Google authorization URL and customer-only OAuth state cookies. }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { description: Authentication rate limit exceeded. }
        '503': { $ref: '#/components/responses/Error' }
  /api/customer-auth/callback/google:
    get:
      operationId: finishCustomerGoogleSignIn
      security: []
      description: Callback forwarded by the storefront BFF with customer OAuth state cookies. Requires one-time state, PKCE and library-verified Google ID-token signature, issuer, audience, expiry and state-bound nonce. Unverified Google email is rejected. Creates or signs into a customer identity keyed by Google subject; never creates or grants merchant access. Implicit account linking is disabled.
      responses:
        '302': { description: Redirect to the fixed customer success or error page with applicable state/session cookies. }
        '400': { $ref: '#/components/responses/Error' }
        '429': { description: Authentication rate limit exceeded. }
        '503': { $ref: '#/components/responses/Error' }
  /api/customer-auth/sign-out:
    post:
      operationId: signOutCustomer
      security: [{ customerSession: [] }]
      description: Invalidates the current customer database session and clears its cookie. Merchant sessions remain separate. Requires the exact storefront Origin, an empty JSON object and no query parameters.
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
      requestBody: { $ref: '#/components/requestBodies/EmptyObject' }
      responses:
        '200': { description: Customer session cleared. }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/customer-auth/ok:
    get:
      operationId: customerAuthHealth
      security: []
      description: Customer authentication readiness. Disabled or invalid configuration fails closed without affecting guest checkout. Does not prove Google consent or callback setup.
      responses:
        '200': { description: Customer authentication handler available. }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/link-social:
    post:
      operationId: linkMerchantGoogleAccount
      security: [{ merchantSession: [] }]
      description: Starts explicit Google enrollment for an already authorized merchant. Both initiation and callback require the same live merchant session and current allowlisted GitHub binding. The callback validates Google signature, issuer, audience, expiry, nonce and verified email before linking the stable Google subject to that same merchant. Email matching alone never grants or links access. An existing different Google binding cannot be replaced by this operation.
      parameters:
        - name: Origin
          in: header
          required: true
          schema: { type: string, format: uri }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [provider, callbackURL, errorCallbackURL]
              properties:
                provider: { const: google }
                callbackURL: { const: /admin/orders }
                errorCallbackURL: { const: /admin/sign-in }
      responses:
        '200': { description: Google authorization URL and merchant OAuth state cookies for explicit enrollment. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { description: Link initiation rate limit exceeded. }
        '503': { $ref: '#/components/responses/Error' }
  /api/auth/callback/google:
    get:
      operationId: finishMerchantGoogleSignIn
      security: []
      description: Completes enabled Google merchant sign-in or explicit enrollment using the same state/PKCE and verified ID-token checks as the shopper flow. Sign-in requires an existing linked Google subject whose merchant retains an approved GitHub identity; enrollment additionally requires the same live merchant session that initiated it. No public merchant signup or email-based implicit linking.
      responses:
        '302': { description: Redirect to the fixed merchant success or error page, with applicable state/session cookies. }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { description: Authentication rate limit exceeded. }
        '503': { $ref: '#/components/responses/Error' }
  /internal/cleanup:
    get:
      operationId: cleanupExpired
      security:
        - cleanupBearer: []
      responses:
        '200':
          description: Eligible expired receipts, replay records and unconsumed quotes removed; unresolved Stripe pending/review records are retained. Returns aggregate counts only; does not reconcile payments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders: { type: integer, minimum: 0 }
                  quotes: { type: integer, minimum: 0 }
                  customerSessions: { type: integer, minimum: 0 }
                  customerVerifications: { type: integer, minimum: 0 }
                  customerRateLimits: { type: integer, minimum: 0 }
                  merchantSessions: { type: integer, minimum: 0 }
                  merchantVerifications: { type: integer, minimum: 0 }
                  merchantRateLimits: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /health:
    get:
      security: []
      operationId: health
      responses:
        '200':
          description: Application is running. Does not claim database readiness.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { const: ok }
components:
  securitySchemes:
    customerSession:
      type: apiKey
      in: cookie
      name: __Secure-joys_customer.session_token
      description: Independent Better Auth signed HttpOnly customer cookie. Database-backed eight-hour session, verified Google account, no automatic extension. Local HTTP fixtures omit __Secure-. Never grants merchant access; service bearer and guest identity cannot replace it.
    merchantSession:
      type: apiKey
      in: cookie
      name: __Secure-joys_merchant.session_token
      description: Better Auth signed HttpOnly cookie, validated against the backend database and explicit GitHub-ID allowlist, including after a linked Google sign-in. Local HTTP fixtures use the same name without __Secure-. Neither ORDERS_API_SECRET nor guest cookies grant merchant access.
    serviceBearer:
      type: http
      scheme: bearer
      description: ORDERS_API_SECRET of at least 32 printable non-space characters, stored only on the storefront and orders servers. The guest header is trusted only from this authenticated server-to-server caller.
    stripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe signature verified against STRIPE_WEBHOOK_SECRET using the exact raw request bytes and timestamp tolerance.
    cleanupBearer:
      type: http
      scheme: bearer
      description: Separate CRON_SECRET. The checkout secret cannot authorize retention cleanup.
  parameters:
    OptionalCustomerSession:
      name: __Secure-joys_customer.session_token
      in: cookie
      required: false
      description: Optional verified shopper session forwarded by the trusted storefront only on creation. The original account ownership (or guest null) is frozen with the order; account changes on a retry return 409 CUSTOMER_CHECKOUT_CHANGED. Expired or tampered cookies return 401 before reservation. The service bearer and guest header remain mandatory.
      schema: { type: string }
    Guest:
      name: X-Guest-Id
      in: header
      required: true
      description: UUID guest identity supplied by the trusted storefront server from its opaque, HttpOnly guest cookie. Never accept a browser-supplied guest header in the storefront proxy.
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Generate once per attempt; retain across ambiguous failures and reloads. Reuse with a different quote is rejected.
      schema: { type: string, format: uuid }
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: '^order_[0-9a-f-]{36}$' }
  requestBodies:
    EmptyObject:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            maxProperties: 0
  schemas:
    CustomerSession:
      type: object
      additionalProperties: false
      required: [user, role]
      properties:
        role: { const: customer }
        user:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string, minLength: 1 }
            displayName: { type: string, minLength: 1, maxLength: 80 }
    MerchantPaymentCheckStatus:
      type: string
      enum: [PENDING, PAID, CANCELED, REQUIRES_REVIEW]
    MerchantPaymentCheckEvent:
      type: object
      additionalProperties: false
      required: [id, requestId, actor, occurredAt, outcome, previousPaymentStatus, resultPaymentStatus]
      properties:
        id: { type: string, format: uuid }
        requestId: { type: string, format: uuid }
        actor:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            displayName: { type: string, minLength: 1, maxLength: 80 }
        occurredAt: { type: string, format: date-time }
        outcome: { type: string, enum: [requested, paid, pending, canceled, review_required, provider_unavailable, already_resolved, interrupted] }
        previousPaymentStatus: { $ref: '#/components/schemas/MerchantPaymentCheckStatus' }
        resultPaymentStatus: { $ref: '#/components/schemas/MerchantPaymentCheckStatus' }
    MerchantPaymentCheckHistory:
      type: object
      additionalProperties: false
      required: [eligibility, events, hasMore]
      properties:
        eligibility:
          type: object
          additionalProperties: false
          required: [eligible, reason, retryAt]
          properties:
            eligible: { type: boolean }
            reason: { type: string, enum: [ready, not_stripe, resolved, missing_session, in_progress, cooldown, payments_disabled] }
            retryAt: { type: [string, 'null'], format: date-time }
        events:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/MerchantPaymentCheckEvent' }
        hasMore: { type: boolean }
    MerchantPaymentCheckResult:
      type: object
      additionalProperties: false
      required: [order, check, replayed]
      properties:
        order: { $ref: '#/components/schemas/Order' }
        check: { $ref: '#/components/schemas/MerchantPaymentCheckEvent' }
        replayed: { type: boolean }
    MerchantOrderPage:
      type: object
      additionalProperties: false
      required: [orders, pageInfo]
      properties:
        orders:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/MerchantOrderSummary' }
        pageInfo:
          type: object
          additionalProperties: false
          required: [nextCursor, hasMore]
          properties:
            nextCursor: { type: [string, 'null'], maxLength: 512 }
            hasMore: { type: boolean }
    MerchantOrderSummary:
      type: object
      additionalProperties: false
      required: [id, reference, createdAt, status, paymentStatus, paymentProvider, totalCents, currency, itemCount]
      properties:
        id: { type: string, pattern: '^order_[0-9a-f-]{36}$' }
        reference: { type: string }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [CONFIRMED, PENDING_PAYMENT, CANCELED, PAYMENT_REVIEW] }
        paymentStatus: { type: string, enum: [SIMULATED, PAID, PENDING, CANCELED, REQUIRES_REVIEW] }
        paymentProvider: { type: string, enum: [simulated, stripe-test] }
        paymentMode: { const: test }
        totalCents: { type: integer, minimum: 0 }
        currency: { const: USD }
        itemCount: { type: integer, minimum: 1, maximum: 594 }
    ProductId:
      type: string
      enum: [demo-desk-mat, demo-notebook, demo-bottle, demo-tote, demo-laptop-stand, demo-desk-lamp]
    ShippingMethod:
      type: string
      enum: [demo-standard, demo-express]
    LineItem:
      type: object
      required: [productId, name, quantity, unitPriceCents, lineTotalCents]
      properties:
        productId: { $ref: '#/components/schemas/ProductId' }
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        unitPriceCents: { type: integer, minimum: 0 }
        lineTotalCents: { type: integer, minimum: 0 }
    Totals:
      type: object
      required: [currency, items, shippingMethod, shippingCents, subtotalCents, taxCents, totalCents, pricingVersion]
      properties:
        currency: { const: USD }
        items:
          type: array
          minItems: 1
          maxItems: 6
          items: { $ref: '#/components/schemas/LineItem' }
        shippingMethod: { $ref: '#/components/schemas/ShippingMethod' }
        shippingCents: { type: integer, minimum: 0 }
        subtotalCents: { type: integer, minimum: 0 }
        taxCents: { type: integer, minimum: 0, description: 'Illustrative 8% of products plus shipping, rounded half-up in cents.' }
        totalCents: { type: integer, minimum: 0 }
        pricingVersion: { const: demo-v1 }
    Quote:
      allOf:
        - $ref: '#/components/schemas/Totals'
        - type: object
          required: [id, expiresAt, paymentProvider]
          properties:
            paymentProvider: { type: string, enum: [simulated, stripe-test] }
            id: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
            expiresAt: { type: string, format: date-time }
    Order:
      allOf:
        - $ref: '#/components/schemas/Totals'
        - type: object
          required: [id, reference, quoteId, status, paymentStatus, createdAt, expiresAt]
          properties:
            id: { type: string, pattern: '^order_[0-9a-f-]{36}$' }
            reference: { type: string }
            quoteId: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
            status: { type: string }
            paymentStatus: { type: string }
            paymentProvider: { type: string, enum: [simulated, stripe-test] }
            paymentMode: { const: test }
            createdAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }
        - oneOf:
            - type: object
              properties:
                reference: { type: string, pattern: '^DEMO-' }
                status: { const: CONFIRMED }
                paymentStatus: { const: SIMULATED }
                paymentProvider: { const: simulated }
              not:
                required: [paymentMode]
              description: Legacy simulated receipts may omit paymentProvider.
            - type: object
              required: [paymentProvider, paymentMode]
              properties:
                reference: { type: string, pattern: '^TEST-' }
                paymentProvider: { const: stripe-test }
                paymentMode: { const: test }
              oneOf:
                - properties:
                    status: { const: PENDING_PAYMENT }
                    paymentStatus: { const: PENDING }
                - properties:
                    status: { const: CONFIRMED }
                    paymentStatus: { const: PAID }
                - properties:
                    status: { const: CANCELED }
                    paymentStatus: { const: CANCELED }
                - properties:
                    status: { const: PAYMENT_REVIEW }
                    paymentStatus: { const: REQUIRES_REVIEW }
    QuoteReference:
      type: object
      additionalProperties: false
      required: [quoteId]
      properties:
        quoteId: { type: string, pattern: '^quote_[0-9a-f-]{36}$' }
    PaymentSession:
      type: object
      required: [order, checkoutUrl]
      properties:
        order:
          allOf:
            - $ref: '#/components/schemas/Order'
            - type: object
              required: [paymentProvider, paymentMode]
              properties:
                paymentProvider: { const: stripe-test }
                paymentMode: { const: test }
        checkoutUrl:
          type: [string, 'null']
          pattern: '^https://checkout\.stripe\.com/'
          description: Resumable hosted URL only for an open pending session; otherwise null. Its presence is not proof of payment.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            retryAt: { type: string, format: date-time, description: Present for payment-check in-progress and rate-limit errors. }
  responses:
    PaymentSession:
      description: Current persisted Stripe test order and a resumable hosted URL when available.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PaymentSession' }
    Error:
      description: Structured safe failure. An ambiguous 503 must retain the original submission key for retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
